<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - One Med Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #1a4f72;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 50px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .chat-header {
            padding: 20px;
            background-color: #1a4f72;
            color: white;
            text-align: center;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #f8f9fa;
        }
        .chat-message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            max-width: 75%;
        }
        .chat-message.assistant {
            background-color: #e3f2fd;
            align-self: flex-start;
        }
        .chat-message.user {
            background-color: #f1f8e9;
            align-self: flex-end;
            text-align: right;
        }
        .chat-input-container {
            display: flex;
            padding: 10px;
            background-color: white;
            border-top: 1px solid #ddd;
        }
        .chat-input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 1rem;
        }
        .chat-input button {
            padding: 0.5rem 1rem;
            background-color: #1a4f72;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .chat-input button:hover {
            background-color: #163a56;
        }
        .upload-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .upload-chat-btn:hover {
            background-color: #f0f0f0;
        }
        .upload-chat-btn svg {
            color: #1a4f72;
        }
        #uploadStatus {
            margin-top: 5px;
            font-size: 12px;
            color: #666;
        }
        /* Styles for structured medical responses */
        .bot-message h3 {
            color: #1a4f72;
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 16px;
            border-bottom: 1px solid #cce5ff;
            padding-bottom: 5px;
        }
        
        .bot-message strong {
            color: #0d47a1;
        }
        
        .bot-message ul {
            margin: 5px 0;
            padding-left: 20px;
        }
        
        .bot-message li {
            margin-bottom: 5px;
        }
        
        .bot-message em {
            font-style: italic;
            color: #555;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="navbar-logo">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="One Med Hub Logo">
                <span>ONE MED HUB</span>
            </div>
            <ul>
                <li><a href="{{ url_for('serve_html') }}">Home</a></li>
                <li><a href="{{ url_for('chatbot') }}" class="active">Chatbot</a></li>
                <li><a href="{{ url_for('x_ray') }}">Analysis</a></li>
                <li><a href="{{ url_for('medilocker') }}">MediLocker</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
                <li><a href="{{ url_for('contact') }}">Contact</a></li>
                <li><a href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="tool-buttons">
            <a href="{{ url_for('pres') }}" class="cta-button primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" style="margin-right: 8px; vertical-align: middle;" viewBox="0 0 16 16">
                    <path d="M8.5 2a.5.5 0 0 0-1 0v.634l-.549-.317a.5.5 0 1 0-.5.866L7 3.5l-.549.317a.5.5 0 1 0 .5.866l.549-.317V5a.5.5 0 1 0 1 0v-.634l.549.317a.5.5 0 1 0 .5-.866L9 3.5l.549-.317a.5.5 0 1 0-.5-.866L8.5 2.634V2ZM7 6.5a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1H7Zm0 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1H7ZM5 7.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5Zm0 3a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5Z"/>
                    <path d="M3 2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H3Zm0 1h10a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
                </svg>
                Prescription Analyzer
            </a>
            <a href="{{ url_for('diag_analysis') }}" class="cta-button secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" style="margin-right: 8px; vertical-align: middle;" viewBox="0 0 16 16">
                    <path d="M4 1h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2h0V3a2 2 0 0 1 2-2z"/>
                    <path d="M10.273 2.513l-.921-.944.715-.698.622.637.89-.011a2.89 2.89 0 0 1 2.924 2.924l-.01.89.636.622a2.89 2.89 0 0 1 0 4.134l-.637.622.011.89a2.89 2.89 0 0 1-2.924 2.924l-.89-.01-.622.636a2.89 2.89 0 0 1-4.134 0l-.622-.637-.89.011a2.89 2.89 0 0 1-2.924-2.924l.01-.89-.636-.622a2.89 2.89 0 0 1 0-4.134l.637-.622-.011-.89a2.89 2.89 0 0 1 2.924-2.924l.89.01.622-.636a2.89 2.89 0 0 1 4.134 0l-.715.698a1.89 1.89 0 0 0-2.704 0l-.92.944-1.32-.016a1.89 1.89 0 0 0-1.911 1.912l.016 1.318-.944.921a1.89 1.89 0 0 0 0 2.704l.944.92-.016 1.32a1.89 1.89 0 0 0 1.912 1.911l1.318-.016.921.944a1.89 1.89 0 0 0 2.704 0l.92-.944 1.32.016a1.89 1.89 0 0 0 1.911-1.912l-.016-1.318.944-.921a1.89 1.89 0 0 0 0-2.704l-.944-.92.016-1.32a1.89 1.89 0 0 0-1.912-1.911l-1.318.016z"/>
                </svg>
                Diagnosis Report Analyzer
            </a>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                One Med Hub AI Assistant
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    Hello! I'm your AI health assistant. How can I help you today?
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="userMessage" placeholder="Type your message..." >
                <button id="sendButton">Send</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 ONE MED HUB. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userMessage = document.getElementById('userMessage');
        const sendButton = document.getElementById('sendButton');
        
        // State variables to track conversation flow
        let currentDisease = null;
        let allQuestions = [];
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let awaitingQuestionAnswer = false;

        // Handle sending messages
        async function sendMessage() {
            const message = userMessage.value.trim();
            if (message === '') return;

            // Add user message to chat
            appendMessage(message, 'user');
            userMessage.value = '';

            // If we're in a question flow, process answer
            if (awaitingQuestionAnswer && currentDisease) {
                processUserAnswer(message);
                return;
            }

            // Handle as a new query
            await processNewQuery(message);
        }

        // Process a new query
        async function processNewQuery(message) {
            try {
                // Make API call to backend chat endpoint
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message }),
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Check if this is a disease-related query requiring questions
                    if (data.isDiseaseQuery) {
                        // Set up the questioning flow
                        currentDisease = data.medicalContent || "your condition";
                        if (data.allQuestions) {
                            allQuestions = data.allQuestions;
                            currentQuestionIndex = 0;
                            userAnswers = {};
                        }
                        
                        // Display the initial response
                        appendMessage(data.response, 'bot');
                        
                        // If there's a current question, display its options
                        if (data.currentQuestion) {
                            displayQuestionOptions(data.currentQuestion);
                            awaitingQuestionAnswer = true;
                        }
                    } else {
                        // Regular response
                        appendMessage(data.response, 'bot');
                    }
                } else {
                    // Fallback to dummy responses if backend call fails
                    const randomResponse = "I'm having trouble understanding that. Could you rephrase your question?";
                    setTimeout(() => appendMessage(randomResponse, 'bot'), 1000);
                }
            } catch (error) {
                console.error('Error:', error);
                appendMessage("I'm having trouble connecting to my knowledge base right now. Please try again later.", 'bot');
            }
        }

        // Process user's answer to a question
        async function processUserAnswer(answer) {
            // Save the answer
            const currentQuestion = allQuestions[currentQuestionIndex];
            userAnswers[currentQuestion.question] = answer;
            
            // Move to next question or finish
            currentQuestionIndex++;
            
            // If there are more questions, display the next one
            if (currentQuestionIndex < allQuestions.length) {
                const nextQuestion = allQuestions[currentQuestionIndex];
                appendMessage(`Next, ${nextQuestion.question}`, 'bot');
                
                // Check if we already have options for this question
                if (nextQuestion.options && nextQuestion.options.length > 0) {
                    displayQuestionOptions(nextQuestion);
                } else {
                    // If not, fetch options from the server based on question type
                    try {
                        const response = await fetch(`/get_question_options?disease=${encodeURIComponent(currentDisease)}&questionType=${encodeURIComponent(nextQuestion.type)}&question=${encodeURIComponent(nextQuestion.question)}`);
                        
                        if (response.ok) {
                            const data = await response.json();
                            nextQuestion.options = data.options;
                            displayQuestionOptions(nextQuestion);
                        } else {
                            // Use default options as fallback
                            displayQuestionOptions({
                                question: nextQuestion.question,
                                options: getDefaultOptionsForType(nextQuestion.type)
                            });
                        }
                    } catch (error) {
                        console.error('Error fetching options:', error);
                        displayQuestionOptions({
                            question: nextQuestion.question,
                            options: getDefaultOptionsForType(nextQuestion.type)
                        });
                    }
                }
                awaitingQuestionAnswer = true;
            } else {
                // No more questions, process all answers
                appendMessage("Thank you for answering all my questions. I'm analyzing your responses now...", 'bot');
                awaitingQuestionAnswer = false;
                
                try {
                    // Send all answers to backend for processing
                    const response = await fetch('/process_symptoms', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            disease: currentDisease,
                            answers: userAnswers
                        }),
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        appendMessage(data.response, 'bot');
                        
                        // Reset state
                        currentDisease = null;
                        allQuestions = [];
                        currentQuestionIndex = 0;
                        userAnswers = {};
                    } else {
                        appendMessage("I'm having trouble processing your answers. Please try again later.", 'bot');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    appendMessage("I'm having trouble connecting to my knowledge base right now. Please try again later.", 'bot');
                }
            }
        }

        // Return default options based on question type
        function getDefaultOptionsForType(questionType) {
            switch (questionType) {
                case 'severity':
                    return ["Mild", "Moderate", "Severe", "Very Severe"];
                case 'duration':
                    return ["Less than 24 hours", "1-3 days", "3-7 days", "1-2 weeks", "More than 2 weeks"];
                case 'frequency':
                    return ["Rarely", "Occasionally", "Frequently", "Constantly"];
                case 'medication':
                    return ["No medications", "Over-the-counter only", "Prescription medications", "Both OTC and prescription"];
                case 'history':
                    return ["Never before", "Once before", "Multiple times", "Chronic condition"];
                default:
                    return ["Yes", "No", "Not sure"];
            }
        }

        // Display question options as clickable buttons
        function displayQuestionOptions(question) {
            // Use the options provided by the server, or get appropriate defaults by question type
            let options;
            
            if (question.options && question.options.length > 0) {
                // Filter out any "Select" options
                options = question.options.filter(option => !option.startsWith("Select"));
            } else if (question.type) {
                // Get defaults based on question type
                options = getDefaultOptionsForType(question.type);
            } else {
                // Last resort fallback
                options = ["Yes", "No", "Not sure"];
            }
            
            // Create options container
            const optionsDiv = document.createElement('div');
            optionsDiv.classList.add('options-container');
            
            // Add options as buttons
            options.forEach(option => {
                const button = document.createElement('button');
                button.classList.add('option-button');
                button.textContent = option;
                button.addEventListener('click', () => {
                    // When clicked, remove options and process answer
                    appendMessage(option, 'user');
                    document.querySelectorAll('.options-container').forEach(el => el.remove());
                    processUserAnswer(option);
                });
                
                optionsDiv.appendChild(button);
            });
            
            // Add option buttons to chat
            chatMessages.appendChild(optionsDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Add message to the chat
        function appendMessage(message, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
            
            // Handle structured responses with markdown-like syntax
            if (sender === 'bot' && (message.includes('###') || message.includes('**'))) {
                // Process markdown-like formatting
                let formattedMessage = message
                    .replace(/###\s+(.*?)(\n|$)/g, '<h3>$1</h3>') // Convert ### headers
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Convert **bold** text
                    .replace(/\*(.*?)\*/g, '<em>$1</em>') // Convert *italic* text
                    .replace(/- (.*?)(\n|$)/g, '<li>$1</li>'); // Convert bullet points
                
                // Clean up the li elements to properly wrap them in ul
                if (formattedMessage.includes('<li>')) {
                    formattedMessage = formattedMessage.replace(/<li>(.*?)<\/li>/g, function(match) {
                        return '<ul>' + match + '</ul>';
                    });
                }
                
                messageDiv.innerHTML = formattedMessage;
            } else {
                messageDiv.textContent = message;
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        userMessage.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>

    <style>
        /* Add styles for the question options */
        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
            justify-content: flex-start;
        }
        
        .option-button {
            background-color: #e3f2fd;
            border: 1px solid #1a4f72;
            border-radius: 20px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .option-button:hover {
            background-color: #1a4f72;
            color: white;
        }
        
        /* Update existing message styles for better UI */
        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            max-width: 75%;
            word-wrap: break-word;
        }
        
        .bot-message {
            background-color: #e3f2fd;
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }
        
        .user-message {
            background-color: #f1f8e9;
            margin-left: auto;
            text-align: right;
            border-bottom-right-radius: 2px;
        }
    </style>
</body>
</html>
